<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050507;
      --bg2: #0c0c10;
      --bg3: #13131a;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #f0f0f5;
      --muted: #7a7a90;
      --accent: #ff2d55;
      --accent2: #ff6b35;
      --accent3: #bf5af2;
      --teal: #30d158;
      --blue: #0a84ff;
      --glow: rgba(255,45,85,0.4);
      --glow2: rgba(191,90,242,0.3);
      --gold: #ffd60a;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
    }

    html, body, #root { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity:0; } to { opacity:1; }
    }
    @keyframes pulse-glow {
      0%,100% { box-shadow: 0 0 20px var(--glow), 0 0 60px rgba(255,45,85,0.15); }
      50%      { box-shadow: 0 0 40px var(--glow), 0 0 100px rgba(255,45,85,0.25); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-12px); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes gradShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes shimmer {
      from { background-position: -200% 0; }
      to   { background-position: 200% 0; }
    }
    @keyframes ticker {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .animate-fade-up    { animation: fadeUp 0.6s ease forwards; }
    .animate-fade-in    { animation: fadeIn 0.4s ease forwards; }
    .animate-float      { animation: float 4s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulse-glow 2.5s ease-in-out infinite; }
    .animate-spin-slow  { animation: spin 8s linear infinite; }

    .grad-text {
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      background-size: 200% 200%;
      animation: gradShift 4s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .grad-text-2 {
      background: linear-gradient(135deg, var(--accent3), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .glass {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .shimmer {
      background: linear-gradient(90deg, var(--bg3) 25%, #1e1e28 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .glow-red    { box-shadow: 0 0 30px rgba(255,45,85,0.3); }
    .glow-purple { box-shadow: 0 0 30px rgba(191,90,242,0.3); }
    .glow-teal   { box-shadow: 0 0 30px rgba(48,209,88,0.3); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #e0234a);
      color: #fff;
    }
    .btn-primary:hover { box-shadow: 0 8px 30px rgba(255,45,85,0.4); transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border2);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
    .btn-gradient {
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      background-size: 200% 200%;
      animation: gradShift 3s ease infinite;
      color: #fff;
      font-weight: 600;
    }
    .btn-gradient:hover { box-shadow: 0 12px 40px rgba(255,45,85,0.5); transform: translateY(-2px); }
    .btn-teal { background: var(--teal); color: #000; font-weight: 600; }
    .btn-teal:hover { box-shadow: 0 8px 30px rgba(48,209,88,0.4); transform: translateY(-1px); }

    .input {
      width:100%;
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input:focus { border-color: var(--accent); }
    .input::placeholder { color: var(--muted); }
    textarea.input { resize: vertical; min-height: 100px; }

    .badge {
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:600;
    }
    .badge-red    { background:rgba(255,45,85,0.15);  color:var(--accent); }
    .badge-purple { background:rgba(191,90,242,0.15); color:var(--accent3); }
    .badge-teal   { background:rgba(48,209,88,0.15);  color:var(--teal); }
    .badge-gold   { background:rgba(255,214,10,0.15); color:var(--gold); }
    .badge-blue   { background:rgba(10,132,255,0.15); color:var(--blue); }

    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top:0;
      left:0;
      z-index: 50;
    }

    .progress-bar {
      height: 4px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      transition: width 0.3s ease;
    }

    .video-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .video-card:hover {
      border-color: rgba(255,45,85,0.4);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      transform: translateY(-4px);
    }

    .stars { color: #ffd60a; letter-spacing: 2px; }

    .ticker-wrap { overflow: hidden; white-space: nowrap; }
    .ticker { display: inline-flex; animation: ticker 20s linear infinite; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
    }

    .orb {
      position:absolute;
      border-radius:50%;
      filter: blur(80px);
      pointer-events:none;
      opacity:0.5;
    }
  </style>
</head>

            <h1 style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 32, marginBottom: 8 }}>Simple, Transparent Pricing</h1>
            <p style={{ color: "var(--muted)", marginBottom: 20 }}>Start free. Scale as you grow.</p>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 12, background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 999, padding: "6px 6px 6px 16px" }}>
              <span style={{ fontSize: 14, color: annual ? "var(--muted)" : "var(--text)" }}>Monthly</span>
              <div onClick={() => setAnnual(a => !a)} style={{ width: 44, height: 24, background: annual ? "var(--teal)" : "var(--bg3)", borderRadius: 999, cursor: "pointer", position: "relative", transition: "background 0.2s" }}>
                <div style={{ position: "absolute", top: 3, left: annual ? 20 : 3, width: 18, height: 18, background: "#fff", borderRadius: "50%", transition: "left 0.2s", boxShadow: "0 2px 6px rgba(0,0,0,0.3)" }} />
              </div>
              <span style={{ fontSize: 14, color: annual ? "var(--text)" : "var(--muted)" }}>Annual</span>
              {annual && <span className="badge badge-teal" style={{ marginLeft: -6 }}>Save 30%</span>}
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(280px,1fr))", gap: 20, maxWidth: 1000, margin: "0 auto" }}>
            {PLANS.map((plan, i) => (
              <div key={plan.id} style={{
                background: plan.popular ? "rgba(255,45,85,0.06)" : "var(--bg2)",
                border: plan.popular ? "2px solid var(--accent)" : "1px solid var(--border)",
                borderRadius: 24, padding: "28px 24px", position: "relative",
                animation: `fadeUp 0.5s ease ${i * 0.1}s both`,
                boxShadow: plan.popular ? "0 0 40px rgba(255,45,85,0.15)" : "none",
              }}>
                {plan.popular && (
                  <div style={{
                    position: "absolute", top: -14, left: "50%", transform: "translateX(-50%)",
                    background: "linear-gradient(135deg,var(--accent),var(--accent3))",
                    color: "#fff", fontSize: 12, fontWeight: 700, padding: "4px 16px", borderRadius: 999
                  }}>
                    ⚡ Most Popular
                  </div>
                )}

                <div style={{ marginBottom: 20 }}>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 22, marginBottom: 4 }}>{plan.name}</div>
                  <div style={{ color: "var(--muted)", fontSize: 13, marginBottom: 16 }}>{plan.desc}</div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                    <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 40 }}>
                      ${annual ? Math.round(plan.price * 0.7) : plan.price}
                    </span>
                    {plan.price > 0 && <span style={{ color: "var(--muted)" }}>/mo</span>}
                  </div>
                  <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 4 }}>
                    {plan.credits === -1 ? "∞ unlimited credits" : `${plan.credits} credits/month`}
                  </div>
                </div>

                <button className={`btn ${plan.popular ? "btn-primary" : "btn-ghost"}`} style={{ width: "100%", justifyContent: "center", marginBottom: 20, padding: "14px" }}>
                  {plan.price === 0 ? "Start Free" : "Get Started"}
                </button>

                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {plan.features.map((f, j) => (
                    <div key={j} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <div style={{ width: 20, height: 20, borderRadius: "50%", background: "rgba(48,209,88,0.15)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        <Icon name="check" size={11} color="var(--teal)" />
                      </div>
                      <span style={{ fontSize: 13 }}>{f}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const SettingsPage = () => {
      return (
        <div style={{ animation: "fadeUp 0.5s ease", maxWidth: 640 }}>
          <div style={{ marginBottom: 28 }}>
            <h1 style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 28, marginBottom: 6 }}>Settings</h1>
            <p style={{ color: "var(--muted)" }}>Manage your account and preferences</p>
          </div>

          <div style={{ background: "linear-gradient(135deg,rgba(255,45,85,0.1),rgba(191,90,242,0.08))", border: "1px solid rgba(255,45,85,0.2)", borderRadius: 16, padding: 20, marginBottom: 24, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                <Icon name="crown" size={16} color="var(--gold)" />
                <span style={{ fontFamily: "var(--font-display)", fontWeight: 700 }}>Pro Plan</span>
                <span className="badge badge-gold">Active</span>
              </div>
              <div style={{ fontSize: 13, color: "var(--muted)" }}>Renews June 11, 2026 · 142 credits remaining</div>
            </div>
            <button className="btn btn-ghost" style={{ fontSize: 13 }}>Manage Billing</button>
          </div>
        </div>
      );
    };

    const LandingPage = ({ setPage }) => {
      const features = [
        { icon: "film", color: "var(--accent)", title: "AI Video Motion", desc: "Cinematic camera movements generated by diffusion AI" },
        { icon: "sparkles", color: "var(--accent3)", title: "Viral Score AI", desc: "Predict virality before you post — only post winners" },
        { icon: "hashtag", color: "var(--teal)", title: "Viral Hashtags", desc: "AI generates the perfect hashtag set to maximize reach" },
      ];

      const stats = [
        { value: "50M+", label: "Videos Created" },
        { value: "2.1B", label: "Views Generated" },
        { value: "94%", label: "Avg Viral Score" },
        { value: "180+", label: "Countries" },
      ];

      return (
        <div style={{ minHeight: "100vh", fontFamily: "var(--font-body)" }}>
          <nav style={{
            position: "fixed", top: 0, left: 0, right: 0, zIndex: 100,
            background: "rgba(5,5,7,0.8)", backdropFilter: "blur(20px)",
            borderBottom: "1px solid var(--border)", padding: "0 32px",
            display: "flex", alignItems: "center", justifyContent: "space-between", height: 64,
          }}>
            <Logo />
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-ghost" style={{ fontSize: 13, padding: "9px 18px" }} onClick={() => setPage("dashboard")}>Log in</button>
              <button className="btn btn-gradient" style={{ fontSize: 13, padding: "9px 18px" }} onClick={() => setPage("generate")}>Start Free</button>
            </div>
          </nav>

          <section style={{ paddingTop: 160, paddingBottom: 100, textAlign: "center", position: "relative", overflow: "hidden" }}>
            <div className="orb" style={{ width: 500, height: 500, left: -100, top: -100, background: "radial-gradient(var(--accent),transparent)" }} />

            <div style={{ position: "relative" }}>
              <div className="badge badge-red" style={{ marginBottom: 20, display: "inline-flex" }}>
                <Icon name="bolt" size={12} color="var(--accent)" /> AI-powered TikTok generator
              </div>

              <h1 style={{
                fontFamily: "var(--font-display)", fontWeight: 800, lineHeight: 1.1,
                fontSize: "clamp(44px,7vw,88px)", marginBottom: 24, letterSpacing: -2,
              }}>
                Create Viral AI<br />
                <span className="grad-text">TikToks in Seconds</span>
              </h1>

              <p style={{
                fontSize: "clamp(16px,2vw,20px)", color: "var(--muted)",
                maxWidth: 580, margin: "0 auto 40px", lineHeight: 1.7,
              }}>
                Upload an image. Write a prompt. Get a cinematic, viral-ready TikTok with AI motion, voice, music and effects.
              </p>

              <button className="btn btn-gradient animate-pulse-glow" onClick={() => setPage("generate")} style={{
                fontSize: 16, padding: "16px 32px", fontFamily: "var(--font-display)", fontWeight: 700,
              }}>
                <Icon name="sparkles" size={18} color="#fff" />
                Start Creating Free
              </button>
            </div>
          </section>

          <section style={{ padding: "100px 24px", maxWidth: 1100, margin: "0 auto" }}>
            <div style={{ textAlign: "center", marginBottom: 60 }}>
              <h2 style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: "clamp(28px,4vw,48px)", marginBottom: 12 }}>
                Everything you need to<br />
                <span className="grad-text-2">go viral on TikTok</span>
              </h2>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(300px,1fr))", gap: 20 }}>
              {features.map((f, i) => (
                <div key={i} className="glass" style={{
                  borderRadius: "var(--radius)", padding: 28,
                  animation: `fadeUp 0.5s ease ${i * 0.07}s both`, transition: "all 0.3s",
                }}>
                  <div style={{ width: 48, height: 48, borderRadius: 14, background: `${f.color}18`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16 }}>
                    <Icon name={f.icon} size={22} color={f.color} />
                  </div>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 17, marginBottom: 8 }}>{f.title}</div>
                  <div style={{ color: "var(--muted)", fontSize: 14, lineHeight: 1.6 }}>{f.desc}</div>
                </div>
              ))}
            </div>
          </section>

          <section style={{ padding: "80px 24px", background: "var(--bg2)", borderTop: "1px solid var(--border)" }}>
            <div style={{ maxWidth: 1100, margin: "0 auto", textAlign: "center" }}>
              <div className="stars" style={{ fontSize: 20, marginBottom: 8 }}>★★★★★</div>
              <h2 style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: "clamp(24px,3vw,40px)", marginBottom: 40 }}>
                Loved by 500K+ creators
              </h2>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(300px,1fr))", gap: 16 }}>
                {REVIEWS.slice(0, 3).map((r, i) => (
                  <div key={i} className="glass" style={{ borderRadius: "var(--radius)", padding: 24, animation: `fadeUp 0.5s ease ${i * 0.07}s both` }}>
                    <div className="stars" style={{ marginBottom: 10, fontSize: 14 }}>★★★★★</div>
                    <p style={{ fontSize: 14, lineHeight: 1.7, marginBottom: 16, color: "rgba(255,255,255,0.85)" }}>"{r.text}"</p>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ width: 36, height: 36, borderRadius: "50%", background: r.color, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 14 }}>{r.avatar}</div>
                      <div style={{ textAlign: "left" }}>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>{r.name}</div>
                        <div style={{ color: "var(--muted)", fontSize: 12 }}>{r.handle}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <footer style={{ background: "var(--bg2)", borderTop: "1px solid var(--border)", padding: "40px 24px 32px", textAlign: "center" }}>
            <Logo />
            <p style={{ color: "var(--muted)", fontSize: 13, marginTop: 12 }}>© 2026 TikTokAI. All rights reserved.</p>
          </footer>
        </div>
      );
    };

    function App() {
      const [page, setPage] = useState("landing");
      const [credits, setCredits] = useState(142);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      const showDashboard = page !== "landing";

      return (
        <div style={{ minHeight: "100vh" }}>
          {showDashboard ? (
            <div style={{ display: "flex" }}>
              <Sidebar page={page} setPage={setPage} credits={credits} open={sidebarOpen} setOpen={setSidebarOpen} />

              <main style={{ marginLeft: 240, flex: 1, minHeight: "100vh", background: "var(--bg)", padding: "32px 32px 60px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 32, borderBottom: "1px solid var(--border)", paddingBottom: 20 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <button className="btn btn-ghost" style={{ fontSize: 13, padding: "8px 14px" }} onClick={() => setPage("landing")}>
                      ← Back to Home
                    </button>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <span className="badge badge-red">
                      <Icon name="bolt" size={11} color="var(--accent)" /> {credits} credits
                    </span>
                    <button className="btn btn-gradient" style={{ padding: "8px 16px", fontSize: 13 }} onClick={() => setPage("pricing")}>
                      Upgrade
                    </button>
                  </div>
                </div>

                {page === "dashboard" && <DashboardPage setPage={setPage} credits={credits} />}
                {page === "generate" && <GeneratePage credits={credits} setCredits={setCredits} />}
                {page === "history" && <HistoryPage />}
                {page === "pricing" && <PricingPage />}
                {page === "settings" && <SettingsPage />}
              </main>
            </div>
          ) : (
            <LandingPage setPage={setPage} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
